spring:
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration
      - net.devh.boot.grpc.client.autoconfigure.GrpcClientSecurityAutoConfiguration
  datasource:
    url: jdbc:h2:mem:clerk-e2e;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  ai:
    model:
      chat: none
      embedding: none
    vectorstore:
      type: none

clerk:
  intelligence:
    enabled: false
  api:
    version: 3.2.0
    legacy-enabled: true
  jwt:
    accept-unsigned-tokens: true
    secret: clerk-dev-signing-key-change-me-please
  debug:
    include-stacktrace: true

grpc:
  server:
    port: -1

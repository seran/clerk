server:
  port: 19090

spring:
  application:
    name: clerk
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration
      - net.devh.boot.grpc.client.autoconfigure.GrpcClientSecurityAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clerkdb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:clerk}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  ai:
    ollama:
      base-url: ${CLERK_LLM_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: always
      chat:
        model: llama3.1:latest
        num-ctx: 8192
        num-predict: -1
        temperature: 0.8
      embedding:
        model: nomic-embed-text:latest
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
    tools:
      limits:
        max-calls-per-tool-default: -1
        max-total-tool-calls: -1

clerk:
  intelligence:
    enabled: ${CLERK_INTELLIGENCE_ENABLED:true}
  api:
    version: 3.2.0
    legacy-enabled: true
  jwt:
    accept-unsigned-tokens: true
    secret: clerk-dev-signing-key-change-me-please
  debug:
    include-stacktrace: true

grpc:
  server:
    port: 9092

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    env:
      show-values: always
    configprops:
      show-values: always